<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Test Case</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #f9fafb;
        color: #111827;
      }
      header {
        position: sticky; top: 0; z-index: 10;
        background: white;
        border-bottom: 1px solid #e5e7eb;
        padding: 14px 20px;
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
      }
      header h1 { margin: 0; font-size: 15px; }
      .header-actions { display: flex; gap: 8px; align-items: center; }
      .container { max-width: 960px; margin: 0 auto; padding: 20px; }
      .section { margin-bottom: 24px; }
      .section-label {
        font-size: 12px; font-weight: 700; text-transform: uppercase;
        color: #6b7280; margin-bottom: 8px;
      }
      input[type="text"], textarea {
        width: 100%; padding: 10px 12px;
        border: 1px solid #d1d5db; border-radius: 8px;
        font-size: 13px; font-family: inherit;
        background: white; color: #111827;
      }
      input[type="text"]:focus, textarea:focus {
        outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15);
      }
      textarea { resize: vertical; min-height: 48px; }
      button {
        appearance: none; border: 1px solid #d1d5db; background: white;
        padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px;
      }
      button.primary { background: #111827; color: white; border-color: #111827; }
      button.primary:hover { background: #1f2937; }
      button.danger { color: #991b1b; border-color: #fecaca; background: #fff1f2; }
      button.success { background: #059669; color: white; border-color: #059669; }
      button:disabled { opacity: .5; cursor: not-allowed; }

      /* Tags */
      .tags-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .tag-chip {
        display: inline-flex; align-items: center; gap: 4px;
        background: #e0e7ff; color: #3730a3; font-size: 12px; font-weight: 600;
        padding: 4px 10px; border-radius: 20px;
      }
      .tag-chip.manual { background: #fef3c7; color: #92400e; }
      .tag-chip button {
        border: none; background: transparent; cursor: pointer;
        font-size: 14px; color: inherit; padding: 0 2px; line-height: 1;
      }
      .tag-add { display: flex; gap: 6px; margin-top: 8px; }
      .tag-add input { width: 200px; }

      /* Steps */
      .step-card {
        background: white; border: 1px solid #e5e7eb; border-radius: 12px;
        padding: 16px; margin-bottom: 12px;
      }
      .step-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 12px;
      }
      .step-num { font-weight: 700; font-size: 13px; color: #6366f1; }
      .step-field { margin-bottom: 10px; }
      .step-field label {
        display: block; font-size: 11px; font-weight: 600;
        color: #6b7280; margin-bottom: 4px;
      }
      .step-meta {
        font-size: 11px; color: #9ca3af; word-break: break-all;
        border-top: 1px solid #f3f4f6; padding-top: 8px; margin-top: 4px;
      }
      .toast {
        position: fixed; bottom: 20px; right: 20px;
        background: #059669; color: white; padding: 10px 20px;
        border-radius: 8px; font-size: 13px; font-weight: 600;
        box-shadow: 0 4px 12px rgba(0,0,0,.15);
        transform: translateY(80px); opacity: 0;
        transition: all .3s ease;
      }
      .toast.show { transform: translateY(0); opacity: 1; }
      .empty { text-align: center; padding: 40px; color: #9ca3af; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="pageTitle">Edit Test Case</h1>
      <div class="header-actions">
        <button id="save" class="primary">Save Changes</button>
        <button id="back">← Back</button>
      </div>
    </header>

    <div class="container">
      <div class="section">
        <div class="section-label">Test Case Name</div>
        <input type="text" id="caseName" placeholder="Enter test case name..." />
      </div>

      <div class="section">
        <div class="section-label">Tags</div>
        <div class="tags-row" id="tagsContainer"></div>
        <div class="tag-add">
          <input type="text" id="tagInput" placeholder="Add tag (e.g. manual, smoke, regression)..." />
          <button id="addTag">Add</button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Steps (<span id="stepCount">0</span>)</div>
        <div id="stepsList"></div>
      </div>
    </div>

    <div class="toast" id="toast">Changes saved!</div>

    <script src="edit-case.js"></script>
  </body>
</html>
